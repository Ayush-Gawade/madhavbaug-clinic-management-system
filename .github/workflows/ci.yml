name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: madhavbaug
          POSTGRES_PASSWORD: madhavbaug
          POSTGRES_DB: madhavbaug_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madhavbaug"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      APP_ENV: staging
      SECRET_KEY: ci-secret-key-please-change-0000000000
      MEDIA_SIGNING_SECRET: ci-media-secret-please-change-0000
      DATABASE_URL: postgresql+asyncpg://madhavbaug:madhavbaug@localhost:5432/madhavbaug_test
      TEST_DATABASE_URL: postgresql+asyncpg://madhavbaug:madhavbaug@localhost:5432/madhavbaug_test
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.x"
      - name: Install dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy app
      - name: Tests (pytest)
        run: uv run pytest

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  infra:
    name: Infra (compose + images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env file
        run: cp .env.example .env
      - name: Validate compose configuration
        run: docker compose -f infra/docker-compose.yml config > /dev/null
      - name: Build API image
        run: docker build -t madhavbaug-api:ci apps/api
      - name: Build edge image
        run: docker build -t madhavbaug-edge:ci -f infra/edge/Dockerfile .
